<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #EFF7F4;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(13, 138, 114, 0.06);
            padding: 40px 36px;
            width: 100%;
            max-width: 440px;
        }
        .brand-title {
            color: #0D8A72;
            font-weight: 700;
            font-size: 1.5rem;
            margin-bottom: 24px;
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #374151;
            margin-bottom: 6px;
        }
        .form-control {
            border: 1px solid #E5E7EB;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 0.92rem;
            color: #111827;
        }
        .form-control:focus {
            border-color: #0D8A72;
            box-shadow: 0 0 0 3px rgba(13, 138, 114, 0.12);
        }
        .password-wrapper {
            position: relative;
        }
        .password-wrapper .form-control {
            padding-right: 60px;
        }
        .toggle-password {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #0D8A72;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
        }
        .teal-link {
            color: #0D8A72;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.85rem;
        }
        .teal-link:hover {
            text-decoration: underline;
            color: #0A6E5B;
        }
        .btn-teal {
            background-color: #0D8A72;
            color: #FFFFFF;
            font-weight: 600;
            border-radius: 8px;
            padding: 11px;
            border: none;
            width: 100%;
            font-size: 0.95rem;
            transition: background-color 0.2s ease;
        }
        .btn-teal:hover {
            background-color: #0A6E5B;
            color: #FFFFFF;
        }
        .form-check-input:checked {
            background-color: #0D8A72;
            border-color: #0D8A72;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <h1 class="brand-title">Log in</h1>

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'info' }} py-2 px-3 small" role="alert">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" novalidate>
        {% csrf_token %}

        <div class="mb-3">
            <label for="id_email" class="form-label">Email address</label>
            <input type="email" name="email" id="id_email" class="form-control"
                   placeholder="Email or Phone" value="{{ form.email.value|default:'' }}" required>
        </div>

        <div class="mb-3">
            <label for="id_password" class="form-label">Password</label>
            <div class="password-wrapper">
                <input type="password" name="password" id="id_password" class="form-control"
                       placeholder="Enter your password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('id_password', this)">Show</button>
            </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" name="remember_me" id="id_remember_me">
                <label class="form-check-label text-muted small" for="id_remember_me">
                    Remember me
                </label>
            </div>
            <a href="#" class="teal-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn-teal">Log in</button>
    </form>

    <p class="text-center text-muted small mt-4 mb-0">
        Don't have an account? <a href="{% url 'register_user' %}" class="teal-link">Register</a>
    </p>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = 'Hide';
        } else {
            input.type = 'password';
            btn.textContent = 'Show';
        }
    }
</script>
</body>
</html>
