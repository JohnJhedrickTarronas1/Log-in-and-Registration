<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #EFF7F4;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .dash-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(13, 138, 114, 0.06);
            padding: 40px;
            max-width: 540px;
            width: 100%;
            text-align: center;
        }
        .badge-role {
            background-color: #E6F4F1;
            color: #0D8A72;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            text-transform: capitalize;
        }
        .btn-teal {
            background-color: #0D8A72;
            color: #FFFFFF;
            font-weight: 600;
            border-radius: 8px;
            padding: 10px 20px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-teal:hover {
            background-color: #0A6E5B;
            color: #FFFFFF;
        }
    </style>
</head>
<body>
<div class="dash-card">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags|default:'success' }} py-2 small">{{ message }}</div>
        {% endfor %}
    {% endif %}

    <span class="badge-role mb-3 d-inline-block">
        {{ user.profile.get_account_type_display|default:"Member" }} Account
    </span>
    <h2 class="fw-bold" style="color: #0D8A72;">
        Welcome to Your Dashboard, {{ user.first_name|default:user.username }}!
    </h2>
    <p class="text-muted mt-2 mb-4">
        Signed in as <strong>{{ user.email }}</strong>
    </p>

    <div class="d-flex justify-content-center gap-2">
        <a href="{% url 'secret_page' %}" class="btn-teal">Go to Secret Page</a>
        <a href="{% url 'logout_user' %}" class="btn btn-outline-danger px-4" style="border-radius: 8px;">Logout</a>
    </div>
</div>
</body>
</html>
