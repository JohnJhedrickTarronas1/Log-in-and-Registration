<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secret Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #EFF7F4;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .secret-card {
            background: #FFFFFF;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(13, 138, 114, 0.08);
            padding: 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            border-top: 5px solid #0D8A72;
        }
    </style>
</head>
<body>
<div class="secret-card">
    <h2 class="fw-bold" style="color: #0D8A72;">Secret Area Unlocked</h2>
    <p class="text-muted mt-3">
        Hello, <strong>{{ user.get_full_name|default:user.username }}</strong>! This page is protected by <code>@login_required</code>.
    </p>
    <div class="d-flex justify-content-center gap-2 mt-4">
        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary" style="border-radius: 8px;">Back to Dashboard</a>
        <a href="{% url 'logout_user' %}" class="btn btn-danger" style="border-radius: 8px;">Logout</a>
    </div>
</div>
</body>
</html>
